version: 2
updates:
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/setup']
    schedule:
      interval: weekly
    # Let a release age a week before adopting it (yanked or compromised versions).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let a release age a week before adopting it (yanked or compromised versions).
    cooldown:
      default-days: 7
    ignore:
      # TypeScript 7 does not work with SvelteKit 3 yet.
      - dependency-name: typescript
        versions: ['>=7']
    groups:
      dependencies:
        patterns: ['*']
